<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヘックス戦記</title>
</head>
<body>
<main>
  <h1>ヘックス戦記</h1>
  <div class="bar">
    <span class="stat" id="tn"></span><span class="stat" id="gd"></span>
    <span id="recruit"></span>
    <button id="be" class="go">ターン終了</button><button id="bn">新規ゲーム</button>
  </div>
  <canvas id="c" tabindex="0" aria-label="ゲーム盤"></canvas>
  <div id="msg"></div>
  <details>
    <summary>遊び方</summary>
    <p>青があなたの軍です。自分の駒をタップして選び、光ったマスへ移動、赤い枠の敵をタップして攻撃します。</p>
    <p>城と村は踏むと自分のものになり、毎ターンの資金が増えます。資金で自分の城に駒を雇えます(駒の能力は units.json で決まります)。森は移動コスト2で防御+1、水は通れません。</p>
    <p>移動した後に、その駒をもう一度タップすると移動を取り消せます(攻撃した後は取り消せません)。駒をダブルクリック(ダブルタップ)すると、その駒の行動を確定して終了します(未移動なら待機)。何もないマスをタップすると選択を解除できます。</p>
    <p>敵の城を奪うか、敵の駒を全滅させると勝ちです。</p>
  </details>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
